name: Docs Deploy

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch remote refs
        run: git fetch --prune --tags origin "+refs/heads/*:refs/remotes/origin/*"

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Resolve doc metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            DOC_VERSION="${GITHUB_REF_NAME}"
            UPDATE_LATEST="false"
            BUILD_RELEASE_BRANCHES="false"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            DOC_VERSION="main"
            UPDATE_LATEST="true"
            BUILD_RELEASE_BRANCHES="true"
          elif [[ "${GITHUB_REF_NAME}" == release/* ]]; then
            DOC_VERSION="${GITHUB_REF_NAME//\//-}"
            UPDATE_LATEST="false"
            BUILD_RELEASE_BRANCHES="false"
          else
            DOC_VERSION="${GITHUB_REF_NAME//\//-}"
            UPDATE_LATEST="false"
            BUILD_RELEASE_BRANCHES="false"
          fi

          SITE_BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"

          RELEASE_PAIRS=""
          RELEASE_VERSIONS=""
          if [[ "${BUILD_RELEASE_BRANCHES}" == "true" ]]; then
            while IFS= read -r ref; do
              [[ -n "${ref}" ]] || continue
              branch="${ref#origin/}"
              version="${branch//\//-}"
              RELEASE_PAIRS+="${version}:${ref}"$'\n'
              RELEASE_VERSIONS+="${version}"$'\n'
            done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin/release/* | sort)
          fi

          EXISTING_VERSIONS=""
          if [[ -d gh-pages/versions ]]; then
            EXISTING_VERSIONS="$(find gh-pages/versions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort || true)"
          fi

          export DOC_VERSION EXISTING_VERSIONS RELEASE_VERSIONS
          AVAILABLE_VERSIONS="$(
            python - <<'PY'
            import os
            import re

            doc_version = os.getenv("DOC_VERSION", "").strip()
            existing = [line.strip() for line in os.getenv("EXISTING_VERSIONS", "").splitlines() if line.strip()]
            release_versions = [line.strip() for line in os.getenv("RELEASE_VERSIONS", "").splitlines() if line.strip()]
            versions = [doc_version, *existing, *release_versions]

            def sort_key(version: str):
                if version == "main":
                    return (0, 0, 0, 0, "")
                match = re.fullmatch(r"(?:release-)?v?(\d+)(?:\.(\d+))?(?:\.(\d+))?([\-\+].*)?", version)
                if match:
                    major = int(match.group(1))
                    minor = int(match.group(2) or 0)
                    patch = int(match.group(3) or 0)
                    suffix = match.group(4) or ""
                    return (1, -major, -minor, -patch, suffix)
                return (2, 0, 0, 0, version)

            for version in sorted(set(v for v in versions if v), key=sort_key):
                print(version)
          PY
          )"

          AVAILABLE_VERSIONS_CSV="$(printf '%s\n' "${AVAILABLE_VERSIONS}" | awk 'NF' | paste -sd ',' -)"

          echo "doc_version=${DOC_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "update_latest=${UPDATE_LATEST}" >> "${GITHUB_OUTPUT}"
          echo "site_base=${SITE_BASE}" >> "${GITHUB_OUTPUT}"
          echo "available_versions=${AVAILABLE_VERSIONS_CSV}" >> "${GITHUB_OUTPUT}"
          {
            echo "release_pairs<<EOF"
            printf '%s' "${RELEASE_PAIRS}"
            echo
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Build primary docs
        env:
          DOC_VERSION: ${{ steps.meta.outputs.doc_version }}
          DOCS_VERSIONS_INDEX_URL: ${{ steps.meta.outputs.site_base }}/versions/index.html
          DOCS_LATEST_URL: ${{ steps.meta.outputs.site_base }}/
          DOCS_AVAILABLE_VERSIONS: ${{ steps.meta.outputs.available_versions }}
        run: sphinx-build --keep-going -b html docs docs/build/html

      - name: Publish docs to gh-pages
        shell: bash
        env:
          DOC_VERSION: ${{ steps.meta.outputs.doc_version }}
          UPDATE_LATEST: ${{ steps.meta.outputs.update_latest }}
          SITE_BASE: ${{ steps.meta.outputs.site_base }}
          AVAILABLE_VERSIONS: ${{ steps.meta.outputs.available_versions }}
          RELEASE_PAIRS: ${{ steps.meta.outputs.release_pairs }}
        run: |
          set -euo pipefail

          mkdir -p "gh-pages/versions/${DOC_VERSION}"
          rsync -a --delete docs/build/html/ "gh-pages/versions/${DOC_VERSION}/"

          if [[ "${UPDATE_LATEST}" == "true" ]]; then
            rsync -a --delete \
              --exclude ".git/" \
              --exclude "versions/" \
              --exclude "source/release/" \
              --exclude ".nojekyll" \
              --exclude "CNAME" \
              docs/build/html/ gh-pages/
          fi

          # Mainline pushes also refresh release/* branches so all published versions stay in sync.
          if [[ "${UPDATE_LATEST}" == "true" && -n "${RELEASE_PAIRS}" ]]; then
            while IFS=: read -r release_version release_ref; do
              [[ -n "${release_version}" && -n "${release_ref}" ]] || continue
              echo "Building docs for ${release_ref} -> versions/${release_version}"
              git checkout --detach "${release_ref}"

              DOC_VERSION="${release_version}" \
              DOCS_VERSIONS_INDEX_URL="${SITE_BASE}/versions/index.html" \
              DOCS_LATEST_URL="${SITE_BASE}/" \
              DOCS_AVAILABLE_VERSIONS="${AVAILABLE_VERSIONS}" \
              sphinx-build --keep-going -b html docs docs/build/html

              mkdir -p "gh-pages/versions/${release_version}"
              rsync -a --delete docs/build/html/ "gh-pages/versions/${release_version}/"
            done <<< "${RELEASE_PAIRS}"

            git checkout --detach "${GITHUB_SHA}"
          fi

          touch gh-pages/.nojekyll

          python - <<'PY'
          import json
          import re
          from html import escape
          from pathlib import Path

          versions_dir = Path("gh-pages/versions")
          versions_dir.mkdir(parents=True, exist_ok=True)

          versions = [p.name for p in versions_dir.iterdir() if p.is_dir()]

          def sort_key(version: str):
              if version == "main":
                  return (0, 0, 0, 0, "")
              match = re.fullmatch(r"(?:release-)?v?(\d+)(?:\.(\d+))?(?:\.(\d+))?([\-\+].*)?", version)
              if match:
                  major = int(match.group(1))
                  minor = int(match.group(2) or 0)
                  patch = int(match.group(3) or 0)
                  suffix = match.group(4) or ""
                  return (1, -major, -minor, -patch, suffix)
              return (2, 0, 0, 0, version)

          versions = sorted(set(versions), key=sort_key)

          links = "\n".join(
              f'        <li><a href="{escape(version)}/index.html">{escape(version)}</a></li>'
              for version in versions
          )

          html = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>efficient-transformers docs versions</title>
            <style>
              body {{
                margin: 2rem auto;
                max-width: 760px;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
                line-height: 1.5;
                padding: 0 1rem;
              }}
              h1 {{ margin-bottom: 0.25rem; }}
              p {{ margin-top: 0; color: #555; }}
            </style>
          </head>
          <body>
            <h1>Documentation Versions</h1>
            <p>Select a published version.</p>
            <ul>
          {links}
            </ul>
          </body>
          </html>
          """

          (versions_dir / "index.html").write_text(html, encoding="utf-8")
          (versions_dir / "versions.json").write_text(json.dumps({"versions": versions}, indent=2), encoding="utf-8")
          PY

          # Backward-compatible redirects for previously published page URLs.
          python - <<'PY'
          from pathlib import Path

          redirects = {
              "source/hl_api.html": "qeff_autoclasses.html",
              "source/ll_api.html": "qeff_autoclasses.html",
          }

          def write_redirect(root: Path, src: str, dst: str):
              target = root / src
              target.parent.mkdir(parents=True, exist_ok=True)
              html = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url={dst}">
            <title>Redirecting...</title>
          </head>
          <body>
            <p>Redirecting to <a href="{dst}">{dst}</a></p>
          </body>
          </html>
          """
              target.write_text(html, encoding="utf-8")

          for src, dst in redirects.items():
              write_redirect(Path("gh-pages"), src, dst)
          PY

          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .

          if git diff --cached --quiet; then
            echo "No documentation changes to publish."
            exit 0
          fi

          git commit -m "docs: publish ${DOC_VERSION} (${GITHUB_SHA::7})"
          git push origin gh-pages
